    <script>
      (function () {
        try {
          var baseFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function () {
              return baseFetch;
            },
            set: function (nextFetch) {
              if (typeof nextFetch === 'function') {
                baseFetch = nextFetch;
              }
            }
          });
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () {
                  return baseFetch;
                },
                set: function (nextFetch) {
                  if (typeof nextFetch === 'function') {
                    baseFetch = nextFetch;
                  }
                }
              });
            } catch (_) {}
          }
        } catch (_) {}

        window.addEventListener(
          'error',
          function (e) {
            var msg = e && e.message ? String(e.message) : '';
            var file = e && e.filename ? String(e.filename) : '';
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              msg.indexOf('fetch of #<Window>') !== -1 ||
              file.indexOf('chrome-extension://') === 0
            ) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var reason = e && e.reason ? String(e.reason.message || e.reason) : '';
            if (
              reason.indexOf('Cannot set property fetch') !== -1 ||
              reason.indexOf('fetch of #<Window>') !== -1 ||
              reason.indexOf('chrome-extension://') !== -1
            ) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
      })();
    </script>
